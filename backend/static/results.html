  <script>
    // Configuration for scoring
    const SCORE_WEIGHTS = {
      audio: {
        wpm: 0.3,
        fillers: 0.3,
        vocabulary: 0.2,
        sentiment: 0.2
      },
      visual: {
        eye_contact: 0.3,
        posture: 0.25,
        gestures: 0.25,
        facial_expression: 0.2
      }
    };

    // Performance labels
    const PERFORMANCE_LABELS = {
      excellent: 'excellent',
      very_good: 'very_good',
      good: 'good',
      needs_improvement: 'needs_improvement'
    };

    // Helper function to get performance label KEY
    function getPerformanceLabelKey(score) {
      if (score >= 90) return PERFORMANCE_LABELS.excellent;
      if (score >= 80) return PERFORMANCE_LABELS.very_good;
      if (score >= 70) return PERFORMANCE_LABELS.good;
      return PERFORMANCE_LABELS.needs_improvement;
    }

    // Track LLM responses
    let llmResponses = {
      audioSummary: null,
      visualSummary: null,
      audioAnalysis: null,
      visualAnalysis: null,
      summary: null,
      recommendations: null,
      actionItems: null
    };

    // Theme toggle function
    function toggleTheme() {
      const htmlElement = document.documentElement;
      const isDark = htmlElement.classList.contains('dark');
      const themeIcon = document.querySelector('#theme-toggle .material-icons-outlined');

      if (isDark) {
        htmlElement.classList.remove('dark');
        if (themeIcon) themeIcon.textContent = 'dark_mode';
        localStorage.setItem('theme', 'light');
      } else {
        htmlElement.classList.add('dark');
        if (themeIcon) themeIcon.textContent = 'light_mode';
        localStorage.setItem('theme', 'dark');
      }
    }

    // Refresh translations helper
    function refreshTranslations() {
      if (window.LanguageSwitcher && window.LanguageSwitcher.getCurrentLanguage) {
        // Re-setting the current language forces an updatePage() call
        window.LanguageSwitcher.setLanguage(window.LanguageSwitcher.getCurrentLanguage());
      }
    }

    // Load and display results when page loads
    document.addEventListener('DOMContentLoaded', function () {
      window.initializeThemeUI();

      // Wait for language switcher to be ready
      function waitForLanguageSwitcher() {
        if (window.LanguageSwitcher && window.LanguageSwitcher.getCurrentLanguage) {
          console.log('✅ Language switcher is ready, loading results...');
          loadAndDisplayResults();
        } else {
          console.log('⏳ Waiting for language switcher...');
          setTimeout(waitForLanguageSwitcher, 100);
        }
      }

      // Start waiting
      waitForLanguageSwitcher();
    });

    function loadAndDisplayResults() {
      const sessionData = JSON.parse(sessionStorage.getItem('sessionResults') || '{}');

      if (!sessionData.audio || !sessionData.visual) {
        // Use translated error message
        const errorMessage = window.LanguageSwitcher.getTranslation('results.noSessionData') ||
          'لم يتم العثور على بيانات الجلسة. يرجى العودة وبدء جلسة جديدة.';
        displayError(errorMessage);
        return;
      }

      // Calculate scores
      const audioScore = calculateAudioScore(sessionData.audio.summary);
      const visualScore = calculateVisualScore(sessionData.visual.summary);

      // Update session info
      updateSessionInfo(sessionData);

      // Display score cards initially with loading states
      displayScoreCardsWithLoading(audioScore, visualScore, sessionData);

      // Start LLM analysis with staggered requests
      startStaggeredLLMAnalysis(sessionData, audioScore, visualScore);

      // Trigger translation refresh for newly added elements
      refreshTranslations();
    }

    function calculateAudioScore(summary) {
      let score = 0;

      console.log("🔍 Audio score calculation from:", {
        language: summary.language,
        wpm: summary.wpm,
        overall_wpm: summary.overall_wpm,
        total_words: summary.total_words,
        total_fillers: summary.total_fillers,
        vocab_diversity: summary.vocab_diversity,
        sentiment_score: summary.sentiment_score
      });

      // 1. WPM Scoring - Different ideal ranges for Arabic vs English
      const wpmValue = summary.overall_wpm || summary.wpm || summary.session_wpm || 0;
      const isArabic = (summary.language || '').toLowerCase() === 'ar';

      // Initialize wpmScore with a default value
      let wpmScore = 40; // Default if no speech detected

      if (wpmValue > 0) {
        if (isArabic) {
          // Arabic ideal range: 80-140 WPM
          const arabicIdealCenter = 110;

          if (wpmValue >= 80 && wpmValue <= 140) {
            // In ideal range: full points with slight adjustment
            wpmScore = 95 - Math.abs(wpmValue - arabicIdealCenter) * 0.17;
          } else if (wpmValue < 80) {
            // Too slow for Arabic
            wpmScore = Math.max(30, 50 + (wpmValue - 50) * 0.67);
          } else {
            // Too fast for Arabic
            wpmScore = Math.max(30, 90 - (wpmValue - 140) * 0.6);
          }
        } else {
          // English ideal range: 120-160 WPM
          const englishIdealCenter = 140;

          if (wpmValue >= 120 && wpmValue <= 160) {
            // In ideal range
            wpmScore = 95 - Math.abs(wpmValue - englishIdealCenter) * 0.125;
          } else if (wpmValue < 120) {
            // Too slow for English
            wpmScore = Math.max(30, 40 + (wpmValue - 80) * 0.75);
          } else {
            // Too fast for English
            wpmScore = Math.max(30, 90 - (wpmValue - 160) * 0.5);
          }
        }

        wpmScore = Math.max(0, Math.min(100, wpmScore));
        console.log(`📊 ${isArabic ? 'Arabic' : 'English'} WPM: ${wpmValue.toFixed(1)} → Score: ${wpmScore.toFixed(1)}`);
      } else {
        // No speech detected or very low WPM
        console.log(`📊 No significant WPM detected, using default: ${wpmScore}`);
      }

      score += wpmScore * SCORE_WEIGHTS.audio.wpm;

      // 2. Filler Words (30% weight) - Same for both languages
      const fillerCount = summary.total_fillers || 0;
      const totalWords = summary.total_words || 1;
      const fillerRate = fillerCount / totalWords;

      let fillerScore;
      if (fillerCount === 0) {
        fillerScore = 100; // Perfect - no filler words
      } else if (fillerRate < 0.02) { // <2% filler rate
        fillerScore = 90;
      } else if (fillerRate < 0.05) { // <5% filler rate
        fillerScore = 80;
      } else if (fillerRate < 0.08) { // <8% filler rate
        fillerScore = 70;
      } else if (fillerRate < 0.12) { // <12% filler rate
        fillerScore = 50;
      } else {
        fillerScore = Math.max(20, 100 - (fillerRate * 400));
      }

      console.log(`📊 Fillers: ${fillerCount}/${totalWords} (${(fillerRate * 100).toFixed(2)}%) → Score: ${fillerScore}`);
      score += fillerScore * SCORE_WEIGHTS.audio.fillers;

      // 3. Vocabulary Diversity (20% weight) - Same for both
      const vocabDiversity = summary.vocab_diversity || 0;
      const vocabScore = Math.min(100, vocabDiversity * 100);
      console.log(`📊 Vocab Diversity: ${(vocabDiversity * 100).toFixed(1)}% → Score: ${vocabScore.toFixed(1)}`);
      score += vocabScore * SCORE_WEIGHTS.audio.vocabulary;

      // 4. Sentiment (20% weight) - Same for both
      const sentimentValue = summary.sentiment_score !== undefined ? summary.sentiment_score : 0;
      let sentimentScore;

      // Convert -1 to +1 scale to 0-100 score
      if (sentimentValue >= 0.3) {
        sentimentScore = 95 + (sentimentValue * 16.7); // 100 at +0.3, 100 at +1.0
      } else if (sentimentValue >= 0) {
        sentimentScore = 70 + (sentimentValue * 83.3); // 70 at 0, 95 at +0.3
      } else if (sentimentValue >= -0.3) {
        sentimentScore = 70 + (sentimentValue * 100); // 70 at 0, 40 at -0.3
      } else {
        sentimentScore = 40 + (sentimentValue * 66.7); // 40 at -0.3, 20 at -1.0
      }

      sentimentScore = Math.max(20, Math.min(100, sentimentScore));
      console.log(`📊 Sentiment: ${sentimentValue.toFixed(3)} → Score: ${sentimentScore.toFixed(1)}`);
      score += sentimentScore * SCORE_WEIGHTS.audio.sentiment;

      const finalScore = Math.max(0, Math.min(100, Math.round(score)));

      // Detailed breakdown - NOW wpmScore is defined
      console.log(`✅ Final Audio Score: ${finalScore}%`);
      console.log(`📈 Breakdown: WPM(${wpmValue.toFixed(1)}):${Math.round(wpmScore * SCORE_WEIGHTS.audio.wpm)}`,
        `Fillers:${Math.round(fillerScore * SCORE_WEIGHTS.audio.fillers)}`,
        `Vocab:${Math.round(vocabScore * SCORE_WEIGHTS.audio.vocabulary)}`,
        `Sentiment:${Math.round(sentimentScore * SCORE_WEIGHTS.audio.sentiment)}`);

      return finalScore;
    }

    function calculateVisualScore(summary) {
      let score = 0;

      console.log("🔍 Visual score calculation from:", {
        eye_contact: summary.eye_contact_percentage,
        posture_quality: summary.posture_quality,
        hand_gestures: summary.hand_gesture_count,
        facial_expression: summary.facial_expression_score
      });

      // 1. Eye Contact (30%)
      const eyeContact = summary.eye_contact_percentage || 0;
      const eyeContactScore = eyeContact; // Direct mapping 0-100
      console.log(`👁️ Eye Contact: ${eyeContact}% → Score: ${eyeContactScore}`);
      score += eyeContactScore * SCORE_WEIGHTS.visual.eye_contact;

      // 2. Posture Quality (25%)
      const posture = summary.posture_quality || 0;
      const postureScore = posture; // Direct mapping 0-100
      console.log(`🧍 Posture: ${posture}% → Score: ${postureScore}`);
      score += postureScore * SCORE_WEIGHTS.visual.posture;

      // 3. Gestures (25%) - Ideal is moderate, not too many or too few
      const gestures = summary.hand_gesture_count || 0;
      let gestureScore;

      // Based on typical per-minute rate
      if (gestures === 0) {
        gestureScore = 40; // No gestures at all
      } else if (gestures < 5) {
        gestureScore = 60 + (gestures * 8); // 60-100 for 0-5 gestures
      } else if (gestures < 15) {
        gestureScore = 85 + ((gestures - 5) * 1.5); // 85-100 for 5-15 gestures
      } else if (gestures < 30) {
        gestureScore = 100 - ((gestures - 15) * 1.33); // 100-80 for 15-30 gestures
      } else {
        gestureScore = Math.max(30, 80 - ((gestures - 30) * 1)); // 80-30 for 30-80 gestures
      }

      gestureScore = Math.max(20, Math.min(100, gestureScore));
      console.log(`👋 Gestures: ${gestures} → Score: ${gestureScore}`);
      score += gestureScore * SCORE_WEIGHTS.visual.gestures;

      // 4. Facial Expression (20%)
      const facialExpr = summary.facial_expression_score || 0;
      const facialExprScore = facialExpr; // Direct mapping 0-100
      console.log(`😊 Facial Expression: ${facialExpr}% → Score: ${facialExprScore}`);
      score += facialExprScore * SCORE_WEIGHTS.visual.facial_expression;

      const finalScore = Math.max(0, Math.min(100, Math.round(score)));

      console.log(`✅ Final Visual Score: ${finalScore}%`);
      console.log(`📈 Breakdown: Eye:${Math.round(eyeContactScore * SCORE_WEIGHTS.visual.eye_contact)}`,
        `Posture:${Math.round(postureScore * SCORE_WEIGHTS.visual.posture)}`,
        `Gestures:${Math.round(gestureScore * SCORE_WEIGHTS.visual.gestures)}`,
        `Face:${Math.round(facialExprScore * SCORE_WEIGHTS.visual.facial_expression)}`);

      return finalScore;
    }

    function getPerformanceLabel(score) {
      if (score >= 90) return PERFORMANCE_LABELS.excellent;
      if (score >= 80) return PERFORMANCE_LABELS.very_good;
      if (score >= 70) return PERFORMANCE_LABELS.good;
      return PERFORMANCE_LABELS.needs_improvement;
    }

    function getScoreColor(score) {
      if (score >= 80) return "#10B981"; // Green for excellent
      if (score >= 70) return "#F59E0B"; // Yellow/Orange for good
      return "#EF4444"; // Red for needs improvement
    }

    function updateSessionInfo(sessionData) {
      const title = document.getElementById('session-title');
      const details = document.getElementById('session-details');

      // Format date and duration
      const date = new Date(sessionData.timestamp).toLocaleDateString('ar-EG');
      const minutes = Math.floor(sessionData.duration / 60);
      const seconds = Math.floor(sessionData.duration % 60);

      // Get current language
      const currentLang = window.LanguageSwitcher.getCurrentLanguage();

      // Format duration based on language
      let durationText;
      if (currentLang === 'ar') {
        // Convert to Eastern Arabic numerals for Arabic
        const arabicDuration = `${convertToEasternNumerals(minutes)} دقائق و ${convertToEasternNumerals(seconds)} ثانية`;
        durationText = arabicDuration;
      } else {
        durationText = `${minutes} minutes and ${seconds} seconds`;
      }

      const language = sessionData.language === 'ar' ?
        (currentLang === 'ar' ? 'العربية' : 'Arabic') :
        'English';

      // Update title with localized format
      // Note: Because this uses simple textContent, we try to fetch translation if available.
      // Ideally this should also be data-i18n but it's dynamic text.
      if (window.LanguageSwitcher && window.LanguageSwitcher.getTranslation) {
        const transTitle = window.LanguageSwitcher.getTranslation('results.analysisTitle');
        if (transTitle) title.textContent = transTitle;
      }

      // Build details text using translations
      let sessionRecording = 'Recorded on';
      let durationLabel = 'Duration';
      let languageLabel = 'Language';
      
      if (window.LanguageSwitcher && window.LanguageSwitcher.getTranslation) {
          sessionRecording = window.LanguageSwitcher.getTranslation('results.sessionRecording') || sessionRecording;
          durationLabel = window.LanguageSwitcher.getTranslation('results.duration') || durationLabel;
          languageLabel = window.LanguageSwitcher.getTranslation('results.language') || languageLabel;
      }

      details.textContent = `${sessionRecording} ${date} - ${durationLabel}: ${durationText} - ${languageLabel}: ${language}`;
    }

    function convertToEasternNumerals(number) {
      // Convert Western Arabic numerals (0-9) to Eastern Arabic numerals
      const easternNumerals = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return number.toString().replace(/\d/g, digit => easternNumerals[parseInt(digit)]);
    }

    function formatSessionTime(timestamp) {
      const date = new Date(timestamp);

      // The toLocaleTimeString with 'ar-EG' locale already uses Eastern Arabic numerals
      return date.toLocaleTimeString('ar-EG', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true  // This will show ص/م for AM/PM in Arabic
      });
    }

    function displayScoreCardsWithLoading(audioScore, visualScore, sessionData) {
      const scoreCards = document.getElementById('score-cards');

      // Get performance label KEYS for data-i18n

            total_fillers: sessionData.audio.summary.total_fillers,
            vocab_diversity: sessionData.audio.summary.vocab_diversity,
            sentiment_label: sessionData.audio.summary.sentiment_label,

          name: 'recommendations',
          endpoint: '/api/v1/analysis/recommendations',

            visual: {

          fallback: {

              "🔄 Refreshing the page may solve the problem."
            ]
          }
        }
      ];

      // Group by priority to ensure critical ones start first
      const priorityGroups = [
        [0, 1], // audio-summary, visual-summary (score cards - highest priority)
        [2, 3], // audio, visual (detailed analysis - medium priority)  
        [4, 5, 6] // summary, recommendations, action-items (main content - lower priority)
      ];

      // Execute groups sequentially, but calls within groups in parallel
      for (let groupIndex = 0; groupIndex < priorityGroups.length; groupIndex++) {
        const groupIndices = priorityGroups[groupIndex];
        const groupPromises = [];

        // Start all calls in this group
        for (const index of groupIndices) {
          const config = apiCalls[index];
          console.log(`▶️ Starting ${config.name} request (group: ${groupIndex + 1}, lang: ${currentLang})`);

          const promise = makeApiCall(config.endpoint, config.data)
            .then(response => {
              console.log(`✅ ${config.name} completed successfully (group: ${groupIndex + 1})`);
              llmResponses[config.name] = response;
              updateUI(config.name, response, sessionData, audioScore, visualScore);
              return response;
            })
            .catch(error => {
              console.error(`❌ ${config.name} failed:`, error);
              llmResponses[config.name] = config.fallback;
              updateUI(config.name, config.fallback, sessionData, audioScore, visualScore);
              return config.fallback;
            });

          groupPromises.push(promise);
        }

        // Wait for all calls in this group to complete before starting next group
        await Promise.allSettled(groupPromises);

        // Small delay between groups to ensure order
        if (groupIndex < priorityGroups.length - 1) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      console.log('🎉 All LLM analysis completed!');
    }

    // Generic API call function with timeout
    async function makeApiCall(endpoint, data) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000); // 120 second timeout

      try {
        // Get the full URL using AppConfig
        const fullUrl = window.AppConfig.getApiUrl(endpoint);

        const response = await fetch(fullUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`API call failed with status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
          throw new Error('Request timeout');
        }
        throw error;
      }
    }

    // Logout function
    function logout() {
      // Show confirmation in current language
      const confirmMessage = window.LanguageSwitcher.getCurrentLanguage() === 'ar'
        ? 'هل أنت متأكد من تسجيل الخروج؟'
        : 'Are you sure you want to log out?';

      if (confirm(confirmMessage)) {
        localStorage.removeItem('ilqaa_token');
        localStorage.removeItem('ilqaa_user');

        if (typeof firebase !== 'undefined' && firebase.auth) {
          firebase.auth().signOut().catch(() => { });
        }

        document.cookie = "ilqaa_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        window.location.href = '/login';
      }
    }

    // Optional: Add user email display
    document.addEventListener('DOMContentLoaded', function () {
      const user = JSON.parse(localStorage.getItem('ilqaa_user') || '{}');
      if (user.email) {
        const userElement = document.getElementById('userEmail');
        if (userElement) {
          userElement.textContent = user.email;
        }
      }
    });
